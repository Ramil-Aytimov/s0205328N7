<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея изображений</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1>Галерея изображений</h1>
            <p>Адаптивный слайдер из восьми фотографий</p>
        </div>
    </header>

    <main class="container">
        <section class="gallery" aria-label="Галерея изображений">
            <div class="gallery-window">
                <div class="gallery-track" id="gallery-track">
                    <figure class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
                            alt="Горный пейзаж">
                    </figure>
                    <figure class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80"
                            alt="Озеро среди гор">
                    </figure>
                    <figure class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80"
                            alt="Солнечный лес">
                    </figure>
                    <figure class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80"
                            alt="Озеро и горы">
                    </figure>
                    <figure class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=900&q=80"
                            alt="Олень в лесу">
                    </figure>
                    <figure class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80"
                            alt="Заснеженные горы">
                    </figure>
                    <figure class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80"
                            alt="Пейзаж на закате">
                    </figure>
                    <figure class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80"
                            alt="Лесная тропинка">
                    </figure>
                </div>
            </div>

            <div class="gallery-controls">
                <button id="previous-button" class="arrow-button" type="button" aria-label="Предыдущая страница"
                    disabled>
                    <span aria-hidden="true">&#8592;</span>
                </button>

                <p id="pager" class="pager" aria-live="polite">1 / 3</p>

                <button id="next-button" class="arrow-button" type="button" aria-label="Следующая страница">
                    <span aria-hidden="true">&#8594;</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Учебный проект — адаптивная галерея</p>
        </div>
    </footer>
</body>

</html>
